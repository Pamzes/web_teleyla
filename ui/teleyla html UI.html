<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleyla</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #4F67FF;
    --accent-light: #EEF0FF;
    --bg-app: #F5F5F7;
    --bg-sidebar: #FFFFFF;
    --bg-chat: #F0F0F5;
    --bg-input: #FFFFFF;
    --text-primary: #1A1A2E;
    --text-secondary: #8E8E9A;
    --text-muted: #B0B0BC;
    --bubble-out: #4F67FF;
    --bubble-in: #FFFFFF;
    --online: #22C55E;
    --divider: #EEEEEF;
    --hover: #F5F5F8;
    --active-bg: #EEF0FF;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 20px;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-app);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 1200px;
    height: 100vh;
    display: flex;
    overflow: hidden;
    background: var(--bg-app);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 320px;
    min-width: 320px;
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    border-right: 0.5px solid var(--divider);
  }

  .sidebar-header {
    padding: 18px 20px 12px;
    border-bottom: 0.5px solid var(--divider);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 20px; height: 20px; }

  .search-wrap {
    padding: 10px 16px 12px;
    background: var(--bg-sidebar);
    border-bottom: 0.5px solid var(--divider);
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-app);
    border-radius: 12px;
    padding: 8px 12px;
  }

  .search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }

  .search-box input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    width: 100%;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 2px; }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .chat-item:hover { background: var(--hover); }
  .chat-item.active { background: var(--active-bg); }
  .chat-item + .chat-item::before {
    content: '';
    position: absolute;
    top: 0; left: 68px; right: 0;
    height: 0.5px;
    background: var(--divider);
  }

  .avatar-wrap { position: relative; flex-shrink: 0; }

  .avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
    user-select: none;
  }

  .online-dot {
    position: absolute;
    bottom: 1px; right: 1px;
    width: 13px; height: 13px;
    background: var(--online);
    border-radius: 50%;
    border: 2px solid #fff;
  }

  .chat-info { flex: 1; min-width: 0; }

  .chat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }

  .chat-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item.unread .chat-name { font-weight: 600; }

  .chat-time {
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .chat-item.unread .chat-time { color: var(--accent); font-weight: 600; }

  .chat-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chat-preview {
    font-size: 13.5px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .chat-item.unread .chat-preview { color: var(--text-primary); font-weight: 500; }

  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 8px;
  }

  /* ── Chat panel ── */
  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-chat);
    min-width: 0;
  }

  .chat-header {
    background: #fff;
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    border-bottom: 0.5px solid var(--divider);
    gap: 12px;
    flex-shrink: 0;
  }

  .chat-header-info { flex: 1; min-width: 0; }

  .chat-header-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .chat-header-status {
    font-size: 12px;
    color: var(--online);
    font-weight: 400;
  }
  .chat-header-status.offline { color: var(--text-secondary); }

  .header-actions { display: flex; gap: 4px; }

  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

  .date-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0 14px;
  }
  .date-divider::before,
  .date-divider::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: rgba(0,0,0,0.1);
  }
  .date-divider span {
    background: #fff;
    font-size: 11.5px;
    color: var(--text-secondary);
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }

  .bubble-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin: 2px 0;
  }
  .bubble-row.out { justify-content: flex-end; }
  .bubble-row.in  { justify-content: flex-start; }

  .bubble {
    max-width: 68%;
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    font-size: 15px;
    line-height: 1.4;
    position: relative;
    word-break: break-word;
  }

  .bubble-row.in .bubble {
    background: var(--bubble-in);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .bubble-row.out .bubble {
    background: var(--bubble-out);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    justify-content: flex-end;
  }

  .bubble-time {
    font-size: 11px;
    opacity: 0.7;
  }

  .check-icon { width: 14px; height: 14px; opacity: 0.75; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-secondary);
  }
  .empty-state svg { width: 56px; height: 56px; opacity: 0.25; }
  .empty-state p { font-size: 14px; }

  /* ── Input bar ── */
  .input-bar {
    background: #fff;
    padding: 10px 16px;
    border-top: 0.5px solid var(--divider);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  .input-attach {
    color: var(--text-secondary);
    flex-shrink: 0;
    margin-bottom: 7px;
  }
  .input-attach svg { width: 22px; height: 22px; }

  .input-field-wrap {
    flex: 1;
    background: var(--bg-app);
    border-radius: 22px;
    display: flex;
    align-items: flex-end;
    padding: 0 12px;
    min-height: 42px;
  }

  .input-field {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-primary);
    padding: 11px 0;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
  }
  .input-field::placeholder { color: var(--text-muted); }

  .input-emoji {
    color: var(--text-secondary);
    margin-bottom: 9px;
    flex-shrink: 0;
  }
  .input-emoji svg { width: 20px; height: 20px; }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s, opacity 0.15s;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:active { transform: scale(0.94); }
  .send-btn svg { width: 20px; height: 20px; color: #fff; }

  .no-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-chat);
    gap: 14px;
    color: var(--text-secondary);
  }
  .no-chat-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .no-chat-icon svg { width: 34px; height: 34px; color: var(--accent); }
  .no-chat h2 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .no-chat p { font-size: 14px; }

  /* Transitions */
  .chat-panel { transition: none; }
  .bubble { animation: bubbleIn 0.18s ease-out; }
  @keyframes bubbleIn {
    from { opacity: 0; transform: scale(0.94) translateY(4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Teleyla</h1>
      <button class="icon-btn" title="Menü" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Suchen..." id="searchInput" oninput="filterChats(this.value)" aria-label="Chats durchsuchen">
      </div>
    </div>

    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- Chat panel (right) -->
  <main class="chat-panel" id="chatPanel">
    <div class="no-chat" id="noChatState">
      <div class="no-chat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h2>Wähle einen Chat</h2>
      <p>Klicke auf einen Kontakt, um die Unterhaltung zu öffnen.</p>
    </div>
  </main>

</div>

<script>
//const COLORS = [        SPÄTER IN DER DATENBANK ODER SO
//  '#7C6AF7','#4F67FF','#9B59B6','#E74C3C',
//  '#1ABC9C','#F39C12','#2ECC71','#3498DB',
//  '#E67E22','#16A085','#8E44AD','#C0392B'
//];

const NOW_TIME = () => {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
// neueste nachricht hier oben rein
const chats = [
  { id:1,  name:'Peter',    sub:'',     time:'',  unread:0, online:false },
  { id:2,  name:'Max',      sub:'',     time:'',  unread:0, online:false },
  { id:3,  name:'Yan',      sub:'',     time:'',  unread:0, online:false },
  { id:4,  name:'Frau Bär', sub:'',     time:'',  unread:0, online:false },
  { id:5,  name:'User 5',   sub:'',     time:'',  unread:0, online:false },
  { id:6,  name:'User 6',   sub:'',     time:'',  unread:0, online:false },
  { id:7,  name:'User 7',   sub:'',     time:'',  unread:0, online:false },
  { id:8,  name:'User 8',   sub:'',     time:'',  unread:0, online:false },
];
// Peter hier kommen die neuen nachrichten rein
const messageStore = {};
chats.forEach(c => { messageStore[c.id] = []; });


let activeId = null;

function initials(name) {
  const p = name.trim().split(' ');
  return p.length >= 2 ? (p[0][0]+p[1][0]).toUpperCase() : p[0][0].toUpperCase();
}

function renderChatList(filter = '') {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  const filtered = chats.filter(c =>
    c.name.toLowerCase().includes(filter.toLowerCase()) ||
    c.sub.toLowerCase().includes(filter.toLowerCase())
  );
  if (!filtered.length) {
    list.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:13px;padding:24px 16px;">Keine Ergebnisse</p>';
    return;
  }
  filtered.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'chat-item' + (c.unread ? ' unread' : '') + (c.id === activeId ? ' active' : '');
    el.dataset.id = c.id;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', `Chat mit ${c.name}`);
    el.innerHTML = `
      <div class="avatar-wrap">
        <div class="avatar" style="background:${COLORS[i % COLORS.length]}">${initials(c.name)}</div>
        ${c.online ? '<div class="online-dot"></div>' : ''}
      </div>
      <div class="chat-info">
        <div class="chat-top">
          <span class="chat-name">${c.name}</span>
          <span class="chat-time">${c.time}</span>
        </div>
        <div class="chat-bottom">
          <span class="chat-preview">${c.sub}</span>
          ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}
        </div>
      </div>`;
    el.addEventListener('click', () => openChat(c.id));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openChat(c.id); });
    list.appendChild(el);
  });
}

function filterChats(val) { renderChatList(val); }

function openChat(id) {
  activeId = id;
  const chat = chats.find(c => c.id === id);
  chat.unread = 0;
  renderChatList(document.getElementById('searchInput').value);
  renderChatPanel(chat);
}

function renderChatPanel(chat) {
  const panel = document.getElementById('chatPanel');
  const colorIdx = chats.findIndex(c => c.id === chat.id) % COLORS.length;
  panel.innerHTML = `
    <header class="chat-header">
      <div class="avatar-wrap">
        <div class="avatar" style="background:${COLORS[colorIdx]};width:40px;height:40px;font-size:14px;">${initials(chat.name)}</div>
        ${chat.online ? '<div class="online-dot" style="width:11px;height:11px;"></div>' : ''}
      </div>
      <div class="chat-header-info">
        <div class="chat-header-name">${chat.name}</div>
        <div class="chat-header-status ${chat.online ? '' : 'offline'}">${chat.online ? 'online' : 'zuletzt aktiv heute'}</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="Anruf" aria-label="Anruf starten" style="color:var(--accent)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 4.18 2 2 0 0 1 5.09 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="icon-btn" title="Video" aria-label="Videoanruf" style="color:var(--accent)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <button class="icon-btn" title="Mehr" aria-label="Mehr Optionen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <div class="messages-area" id="messagesArea" aria-live="polite" aria-label="Nachrichten"></div>
    <div class="input-bar">
      <button class="icon-btn input-attach" title="Datei anhängen" aria-label="Datei anhängen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <div class="input-field-wrap">
        <textarea class="input-field" id="msgInput" rows="1" placeholder="Nachricht schreiben..." aria-label="Nachricht eingeben"></textarea>
        <button class="icon-btn input-emoji" title="Emoji" aria-label="Emoji einfügen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5" stroke-linecap="round"/><line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="Nachricht senden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>`;

  renderMessages(chat.id);
  setupInput(chat.id);
}

function renderMessages(chatId) {
  const area = document.getElementById('messagesArea');
  if (!area) return;
  area.innerHTML = '';

  const msgs = messageStore[chatId];
  if (!msgs.length) {
    area.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Noch keine Nachrichten. Schreib als Erster!</p>
      </div>`;
    return;
  }

  const divider = document.createElement('div');
  divider.className = 'date-divider';
  divider.innerHTML = '<span>Heute</span>';
  area.appendChild(divider);

  msgs.forEach(m => area.appendChild(buildBubble(m)));
  area.scrollTop = area.scrollHeight;
}

function buildBubble(m) {
  const row = document.createElement('div');
  row.className = `bubble-row ${m.out ? 'out' : 'in'}`;
  const checkSvg = m.out ? `
    <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      ${m.read ? '<path d="M1 12 l4 4 8-8"/><path d="M9 12 l4 4 8-8"/>' : '<polyline points="20 6 9 17 4 12"/>'}
    </svg>` : '';
  row.innerHTML = `
    <div class="bubble">
      ${m.text}
      <div class="bubble-meta">
        <span class="bubble-time">${m.time}</span>
        ${checkSvg}
      </div>
    </div>`;
  return row;
}

function addMessage(chatId, text, out = true) {
  const time = NOW_TIME();
  messageStore[chatId].push({ text, out, time, read: false });
  const area = document.getElementById('messagesArea');
  if (!area) return;
  // Remove empty state if present
  const empty = area.querySelector('.empty-state');
  if (empty) {
    area.innerHTML = '';
    const divider = document.createElement('div');
    divider.className = 'date-divider';
    divider.innerHTML = '<span>Heute</span>';
    area.appendChild(divider);
    messageStore[chatId].forEach(m => area.appendChild(buildBubble(m)));
  } else {
    const msgs = messageStore[chatId];
    area.appendChild(buildBubble(msgs[msgs.length - 1]));
  }
  area.scrollTop = area.scrollHeight;

  // Update sidebar preview
  const chat = chats.find(c => c.id === chatId);
  if (chat) {
    chat.sub = text.length > 38 ? text.slice(0, 38) + '…' : text;
    chat.time = time;
  }
  renderChatList(document.getElementById('searchInput').value);
}

function setupInput(chatId) {
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  if (!input || !btn) return;

  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '';
    addMessage(chatId, text, true);
  };

  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.focus();
}

// Boot
renderChatList();
</script>
</body>
</html>
